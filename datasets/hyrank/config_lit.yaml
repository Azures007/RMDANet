# HyRANK: Dioni -> Loukia (lit-recipe: TAPDA/MSDA-style training)
dataset:
  source_name: Dioni
  target_name: Loukia
  num_classes: 12

training:
  patch_size: 7
  batch_size: 32
  eval_batch_size: 256
  eval_interval: 10
  log_interval: 10
  epochs: 50
  lr: 0.1
  weight_decay: 0.0005
  grad_clip: 5.0
  optimizer_type: sgd
  constant_lr: true
  input_normalization: band
  source_samples_per_class: 180
  source_budget_train_fraction: 1.0
  source_train_ratio: 0.2
  strict_source_budget: true
  steps_per_epoch: 40
  min_steps_per_epoch: 5
  source_sampler_power: 1.0
  source_class_weight_power: 0.0
  target_train_max_samples: 15000
  band_alignment_strength: 0.1
  num_workers: 4
  amp: true
  label_smoothing: 0.0

uda:
  use_gt_target_mask: false
  target_gt_mix_ratio: 0.0
  select_final_epoch: true
  lit_feature_dim: 128
  lit_ema_decay: 0.99
  lit_tau_start: 0.75
  lit_tau_end: 0.85
  lit_pseudo_start: 10
  lit_pseudo_ramp: 15
  lit_pseudo_weight: 0.20
  lit_discrepancy_weight: 0.20
  lit_discrepancy_ramp: 10
  lit_bnm_weight: 0.0
  lit_bnm_start: 5
  lit_bnm_ramp: 10
