dataset:
  source_name: Dioni
  target_name: Loukia
  num_classes: 12

training:
  patch_size: 7
  batch_size: 128
  eval_batch_size: 256
  epochs: 60
  lr: 0.001
  weight_decay: 0.0004
  grad_clip: 5.0
  # r23 protocol: 20% training labels + 18% validation (budget = train+val total)
  source_train_ratio: 0.38
  source_budget_train_fraction: 0.526
  # cap optimizer steps per epoch (20% labels would otherwise double the updates)
  steps_per_epoch: 15
  source_samples_per_class: 0
  target_train_max_samples: 15000
  band_alignment_strength: 0.1
  ema_decay: 0.996
  label_smoothing: 0.035
  num_workers: 8
  amp: true

uda:
  ablation_id: full
  # v6-compatible behavior (r23): no maturity gate, no brittle-pseudo downweight
  align_maturity_gate: false
  independent_target_reweight: false
  pseudo_start_epoch: 40
  lmmd_start_epoch: 60
  pseudo_warm_epochs: 30
  # scheme B: rescue starved pseudo classes (class 5/9/10)
  pseudo_min_per_class: 2
  pseudo_confidence: 0.95
  reliability_threshold: 0.40
  target_gt_mix_ratio: 0.0
  use_gt_target_mask: false
  lambda_coral: 0.5
  lambda_lmmd: 0.5
  lambda_cca: 0.5
  cca_start_epoch: 0
  cca_temperature: 0.10
  prat_style_max: 0.4
  prat_warm_epochs: 50
  strict_class_balance_strength: 1.0
  balance_weight_flag: true
  pseudo_balance_flag: true
  prototype_align_flag: true
  prototype_weight: 0.03
  prototype_confidence: 0.95
  prototype_temperature: 0.08
  include_target_scale_mi: true
  use_early_target_adaptation: true
  memory_update_start_epoch: 1
  cempa_min_age: 2
  cempa_min_streak: 2
