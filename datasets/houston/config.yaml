# Houston: Houston13 -> Houston18
# Literature-aligned protocol (v3.0): 180 labeled source samples per class,
# no source validation split, 50 epochs x 40 steps, final epoch reported.
# Patch size aligned with the HSI-UDA literature (7x7).
# SGD momentum 0.9 + cosine lr; batch 128 and extra modules are kept from v7.1.
dataset:
  source_name: Houston13
  target_name: Houston18
  num_classes: 7

training:
  patch_size: 7
  batch_size: 128
  eval_batch_size: 512
  eval_interval: 5
  epochs: 50
  lr: 0.1
  weight_decay: 0.0004
  grad_clip: 5.0
  # SGD momentum 0.9 with cosine lr (literature-style optimizer; batch kept at 128)
  optimizer_type: sgd
  constant_lr: false
  # literature-aligned source budget: 180 labeled samples per class, all used for training
  source_samples_per_class: 180
  source_budget_train_fraction: 1.0
  # kept for the ratio-based fallback path (ignored when samples_per_class > 0)
  # 20% of each class's labeled source pixels, all used for training (no val split)
  source_train_ratio: 0.20
  steps_per_epoch: 40
  source_sampler_power: 1.0
  target_train_max_samples: 30000
  band_alignment_strength: 0.45
  ema_decay: 0.996
  label_smoothing: 0.035
  num_workers: 8
  amp: true

uda:
  ablation_id: full
  align_maturity_gate: false
  independent_target_reweight: false
  # no source validation -> report the final epoch (literature-aligned)
  # pick the epoch with the best label-free reliability score (no target labels)
  select_mode: label_free
  select_final_epoch: false
  # schedule scaled to 50 epochs (proportional to the 60-epoch v2.2b schedule)
  anchor_freeze_epoch: 17
  pseudo_start_epoch: 17
  pseudo_warm_epochs: 10
  lmmd_start_epoch: 25
  lmmd_warm_epochs: 8
  # pseudo-label gates
  pseudo_confidence: 0.95
  reliability_threshold: 0.45
  pseudo_margin: 0.10
  # per-class minimum pseudo-label quota: keeps silent classes (e.g. Bitumen) alive
  pseudo_min_per_class: 0
  # module set: CCA + CORAL + LMMD + prototype alignment
  lambda_cca: 0.5
  cca_start_epoch: 0
  cca_temperature: 0.10
  lambda_coral: 0.3
  lambda_lmmd: 0.3
  prototype_align_flag: true
  prototype_weight: 0.03
  prototype_confidence: 0.95
  prototype_temperature: 0.08
  include_target_scale_mi: true
  strict_class_balance_strength: 1.0
  use_early_target_adaptation: true
  memory_update_start_epoch: 1
  # dataset-specific PRAT strength
  prat_style_max: 0.64
  prat_warm_epochs: 23
  # multi-prototype quotas
  cempa_class_cap: 24
  cempa_min_age: 2
  cempa_min_streak: 2
  # strict UDA guards
  target_gt_mix_ratio: 0.0
  use_gt_target_mask: false
